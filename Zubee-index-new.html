<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070710">
<meta name="description" content="Zubee AI — your intelligent AI assistant">
<title>Zubee AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070710;--panel:rgba(18,18,32,.82);--panel2:rgba(27,27,45,.9);
  --text:#f7f7ff;--muted:#9999ad;--accent:#735cff;--accent2:#a47cff;
  --border:rgba(255,255,255,.09);--danger:#ff6b7a
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(115,92,255,.2),transparent 28%),
    radial-gradient(circle at 85% 85%,rgba(164,124,255,.13),transparent 30%),
    var(--bg);color:var(--text)
}
button,input{font:inherit}
button{color:inherit}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.32;animation:orb 13s ease-in-out infinite alternate}
.orb.a{width:280px;height:280px;background:#6953ff;top:-100px;left:-80px}
.orb.b{width:230px;height:230px;background:#b36cff;right:-80px;bottom:5%;animation-delay:-5s}
.orb.c{width:170px;height:170px;background:#405cff;left:45%;top:45%;animation-delay:-8s}
@keyframes orb{to{transform:translate(45px,-35px) scale(1.15)}}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(110vh);opacity:0}15%{opacity:.7}85%{opacity:.7}to{transform:translateY(-10vh);opacity:0}}

.panda{position:absolute;right:6%;top:13%;width:105px;height:105px;opacity:.9;animation:panda 4s ease-in-out infinite}
@keyframes panda{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-17px) rotate(2deg)}}
.panda-body,.panda-head{position:absolute;background:#fff;border-radius:50%;box-shadow:0 15px 35px #0003}
.panda-body{width:72px;height:65px;left:17px;top:31px}
.panda-head{width:72px;height:65px;left:17px;top:5px}
.ear{position:absolute;width:27px;height:27px;background:#111;border-radius:50%;top:0}
.ear.l{left:12px}.ear.r{right:12px}
.eye{position:absolute;width:18px;height:25px;background:#111;border-radius:50%;top:27px}
.eye.l{left:15px;transform:rotate(25deg)}.eye.r{right:15px;transform:rotate(-25deg)}
.eye:after{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:6px;left:5px}
.nose{position:absolute;width:10px;height:8px;background:#111;border-radius:50%;left:31px;top:46px}
.arm{position:absolute;width:20px;height:38px;background:#111;border-radius:20px;top:38px}
.arm.l{left:2px;transform:rotate(35deg)}.arm.r{right:2px;transform:rotate(-35deg)}

.app{position:relative;z-index:2;width:100%;height:100vh;display:flex;flex-direction:column}
.header{
  height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--border);
  background:#080812a6;backdrop-filter:blur(20px)
}
.brand{display:flex;align-items:center;gap:11px}
.logo,.big-logo{
  display:grid;place-items:center;background:linear-gradient(135deg,#735cff,#a47cff);
  box-shadow:0 10px 35px #735cff55
}
.logo{width:42px;height:42px;border-radius:14px;font-size:22px}
.brand-text{font-size:20px;font-weight:800}
.status{display:flex;align-items:center;gap:7px;color:#aaaabd;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#50e38a;box-shadow:0 0 12px #50e38a}

.chat{flex:1;overflow-y:auto;padding:28px max(18px,calc((100% - 900px)/2));scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:6px}.chat::-webkit-scrollbar-thumb{background:#fff2;border-radius:20px}
.message{display:flex;margin-bottom:22px;animation:in .3s ease}
.message.user{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.bubble{
  max-width:min(760px,88%);padding:14px 17px;border-radius:20px;
  line-height:1.65;font-size:15px;white-space:pre-wrap;word-break:break-word
}
.message.ai .bubble{background:#1b1b2bcf;border:1px solid var(--border);border-bottom-left-radius:7px}
.message.user .bubble{background:linear-gradient(135deg,#644cff,#8067ff);border-bottom-right-radius:7px}
.actions{display:flex;gap:5px;margin-top:8px}
.action{
  border:1px solid var(--border);background:#ffffff08;color:#a9a9bc;
  padding:5px 8px;border-radius:9px;font-size:11px;cursor:pointer
}
.action:hover{background:#ffffff12;color:#fff}

.welcome{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.welcome-inner{max-width:650px}
.big-logo{width:82px;height:82px;margin:0 auto 20px;border-radius:27px;font-size:43px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.welcome h1{font-size:clamp(35px,7vw,58px);letter-spacing:-2px;margin-bottom:10px}
.gradient{background:linear-gradient(90deg,#9a85ff,#d2bfff);-webkit-background-clip:text;color:transparent}
.welcome p{color:var(--muted);font-size:16px;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:25px}
.suggestion{border:1px solid var(--border);background:#ffffff08;color:#d8d8e7;padding:10px 14px;border-radius:14px;cursor:pointer;transition:.2s}
.suggestion:hover{background:#735cff22;border-color:#735cff80;transform:translateY(-2px)}

.bottom{padding:12px max(15px,calc((100% - 900px)/2)) 18px;background:linear-gradient(to top,#070710,rgba(7,7,16,.72),transparent)}
.input-box{
  display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);
  border-radius:22px;background:#151523e0;backdrop-filter:blur(25px);box-shadow:0 20px 60px #0005
}
.input-box:focus-within{border-color:#735cffaa;box-shadow:0 0 0 3px #735cff14,0 20px 60px #0005}
#input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:13px 12px;font-size:16px}
#input::placeholder{color:#77778b}
.send{width:48px;height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,#735cff,#987cff);font-size:20px;cursor:pointer;transition:.2s}
.send:hover{transform:translateY(-2px) scale(1.03)}.send:active{transform:scale(.94)}.send:disabled{opacity:.5;cursor:not-allowed}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:0 5px}
.tools span{font-size:11px;color:#66667a}
.clear{background:transparent;border:0;color:#77778d;font-size:11px;cursor:pointer}.clear:hover{color:#fff}
.typing{display:flex;gap:5px}.typing i{width:7px;height:7px;border-radius:50%;background:#aaa;animation:dot 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.error{color:#ff9ca7}
@media(max-width:600px){
  .header{height:64px;padding:0 14px}.brand-text{font-size:18px}
  .panda{right:-20px;top:8%;transform:scale(.7);opacity:.25}
  .chat{padding:20px 12px}.bubble{max-width:92%}.welcome{padding:20px}
  .welcome h1{font-size:38px}.suggestion{font-size:13px}.bottom{padding:8px 10px 12px}
}
</style>
</head>

<body>
<div class="background">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="particle" style="left:6%;animation-duration:12s"></div>
  <div class="particle" style="left:18%;animation-duration:17s;animation-delay:-4s"></div>
  <div class="particle" style="left:31%;animation-duration:14s;animation-delay:-7s"></div>
  <div class="particle" style="left:46%;animation-duration:18s;animation-delay:-2s"></div>
  <div class="particle" style="left:63%;animation-duration:13s;animation-delay:-8s"></div>
  <div class="particle" style="left:79%;animation-duration:16s;animation-delay:-5s"></div>
  <div class="particle" style="left:91%;animation-duration:19s;animation-delay:-10s"></div>

  <div class="panda">
    <div class="ear l"></div><div class="ear r"></div>
    <div class="panda-body"></div>
    <div class="panda-head">
      <div class="eye l"></div><div class="eye r"></div><div class="nose"></div>
    </div>
    <div class="arm l"></div><div class="arm r"></div>
  </div>
</div>

<div class="app">
<header class="header">
  <div class="brand"><div class="logo">🤖</div><div class="brand-text">Zubee AI</div></div>
  <div class="status"><div class="status-dot"></div>Online</div>
</header>

<main class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-inner">
      <div class="big-logo">🐝</div>
      <h1>Meet <span class="gradient">Zubee</span></h1>
      <p>Your intelligent AI assistant. Ask questions, learn something new, solve problems or just chat.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain quantum physics in very simple words')">🧠 Explain something</button>
        <button class="suggestion" onclick="useSuggestion('Give me a difficult Class 10 science question')">📚 Study with me</button>
        <button class="suggestion" onclick="useSuggestion('Give me 5 interesting facts')">🌎 Interesting facts</button>
      </div>
    </div>
  </div>
</main>

<div class="bottom">
  <div class="input-box">
    <input id="input" type="text" placeholder="Ask Zubee anything..." autocomplete="off">
    <button class="send" id="sendButton" onclick="sendMessage()" aria-label="Send">➤</button>
  </div>
  <div class="tools">
    <span>Powered by Gemini • Zubee AI</span>
    <button class="clear" onclick="clearChat()">Clear chat</button>
  </div>
</div>
</div>

<script>
"use strict";

/*
  IMPORTANT:
  The Gemini API key is NOT stored here.
  This page calls your Vercel backend only.
*/
const API_URL = "https://zubee-ai.vercel.app/api/chat";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");

let history = [];
let busy = false;

function addMessage(text, type) {
  const row = document.createElement("div");
  row.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);

  if (type === "ai") {
    const actions = document.createElement("div");
    actions.className = "actions";

    const copy = document.createElement("button");
    copy.className = "action";
    copy.textContent = "Copy";
    copy.onclick = () => navigator.clipboard?.writeText(text);

    const speak = document.createElement("button");
    speak.className = "action";
    speak.textContent = "🔊";
    speak.onclick = () => speakText(text);

    actions.appendChild(copy);
    actions.appendChild(speak);
    row.appendChild(actions);
  }

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "message ai";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return { row, bubble };
}

function useSuggestion(text) {
  input.value = text;
  input.focus();
  sendMessage();
}

async function sendMessage() {
  if (busy) return;

  const text = input.value.trim();
  if (!text) return;

  busy = true;
  sendButton.disabled = true;
  input.disabled = true;

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  addMessage(text, "user");
  input.value = "";

  const typing = addTyping();

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 45000);

    let response;
    try {
      response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: history.slice(-20)
        }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }

    const raw = await response.text();
    let data = {};

    try {
      data = raw ? JSON.parse(raw) : {};
    } catch {
      data = { error: raw || "Invalid server response" };
    }

    if (!response.ok) {
      const detail =
        data?.details?.details?.error?.message ||
        data?.details?.error?.message ||
        data?.details?.message ||
        data?.error ||
        `HTTP ${response.status}`;

      throw new Error(detail);
    }

    const answer = String(data.answer || "").trim();

    if (!answer) {
      throw new Error("The AI returned an empty answer.");
    }

    typing.row.remove();
    addMessage(answer, "ai");

    history.push({ role: "user", text });
    history.push({ role: "assistant", text: answer });

  } catch (error) {
    console.error("Zubee request failed:", error);
    typing.row.remove();

    let message = "Zubee couldn't get an answer right now.";

    if (error.name === "AbortError") {
      message = "Zubee took too long to respond. Please try again.";
    } else if (error.message) {
      message += "\n\nServer: " + error.message;
    }

    const bubble = addMessage(message, "ai");
    bubble.classList.add("error");
  } finally {
    busy = false;
    sendButton.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1;
  speechSynthesis.speak(utterance);
}

function clearChat() {
  history = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-inner">
        <div class="big-logo">🐝</div>
        <h1>Meet <span class="gradient">Zubee</span></h1>
        <p>Your intelligent AI assistant. Ask questions, learn something new, solve problems or just chat.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion('Explain quantum physics in very simple words')">🧠 Explain something</button>
          <button class="suggestion" onclick="useSuggestion('Give me a difficult Class 10 science question')">📚 Study with me</button>
          <button class="suggestion" onclick="useSuggestion('Give me 5 interesting facts')">🌎 Interesting facts</button>
        </div>
      </div>
    </div>`;
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
