<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zubee AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050713;--line:#ffffff18;--text:#f8f8ff;--muted:#9ca3c7;--purple:#8b5cf6;--cyan:#22d3ee}
html,body{width:100%;height:100%}
body{overflow:hidden;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,#7c3aed40,transparent 30%),radial-gradient(circle at 85% 70%,#06b6d440,transparent 30%),#050713}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-10}
.blob{position:absolute;width:450px;height:450px;border-radius:50%;filter:blur(100px);opacity:.22;animation:float 12s ease-in-out infinite alternate}
.blob1{background:#8b5cf6;left:-150px;top:-130px}.blob2{background:#06b6d4;right:-150px;top:30%;animation-delay:2s}.blob3{background:#ec4899;left:35%;bottom:-220px;animation-delay:4s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,50px) scale(1.2)}}
.stars{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:70px 70px;animation:stars 20s linear infinite}
@keyframes stars{to{background-position:70px 70px}}
.panda{position:fixed;top:15px;right:18px;z-index:50;font-size:64px;filter:drop-shadow(0 15px 20px #0009);animation:pandaJump 1.7s ease-in-out infinite}
.pandaText{display:block;text-align:center;font-size:10px;padding:4px 8px;margin-top:-8px;border-radius:50px;background:#11182ddd;border:1px solid #ffffff20}
@keyframes pandaJump{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-30px) rotate(7deg)}}
.app{height:100vh;display:flex}
.sidebar{width:250px;flex-shrink:0;padding:18px;background:#050713dd;backdrop-filter:blur(25px);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}.logoIcon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;font-size:23px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 10px 40px #8b5cf655}.logoTitle{font-size:20px;font-weight:800}.logoSub{color:var(--muted);font-size:10px}
.newChat{width:100%;padding:12px;border:0;border-radius:12px;color:white;font-weight:700;background:linear-gradient(135deg,var(--purple),#4f46e5);margin-bottom:15px;cursor:pointer}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d4d7eb;text-align:left;padding:11px;border-radius:10px;cursor:pointer}.nav button:hover{background:#ffffff0d}
.status{margin-top:auto;padding:10px;border-radius:10px;border:1px solid #22c55e30;background:#22c55e0b;color:#7df3ae;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#070a16aa;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topTitle{font-weight:800}.connection{margin-left:10px;color:#7df3ae;font-size:12px}
.chat{flex:1;overflow-y:auto;padding:30px 18px 150px}.chatInner{max-width:900px;margin:auto}
.welcome{text-align:center;padding-top:10vh}.orb{width:82px;height:82px;margin:auto;display:grid;place-items:center;border-radius:26px;font-size:40px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 70px #8b5cf655;animation:orbPulse 2.5s infinite}
@keyframes orbPulse{50%{transform:scale(1.07);box-shadow:0 0 100px #8b5cf655}}
.welcome h1{margin:18px 0 8px;font-size:36px}.welcome p{color:var(--muted)}
.cards{max-width:650px;margin:28px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:white;text-align:left;cursor:pointer;transition:.2s}.card:hover{border-color:#8b5cf677;transform:translateY(-2px)}
.message{display:flex;gap:12px;max-width:850px;margin:0 auto 25px}.avatar{width:37px;height:37px;min-width:37px;display:grid;place-items:center;border-radius:12px;background:#ffffff0e;font-size:12px}.ai .avatar{background:linear-gradient(135deg,var(--purple),var(--cyan))}.messageName{color:var(--muted);font-size:11px;margin-bottom:5px}.messageContent{font-size:15px;line-height:1.7;word-break:break-word}.messageContent pre{background:#02040b;border:1px solid var(--line);padding:15px;border-radius:12px;overflow:auto;margin:12px 0}.messageContent code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:8px;margin-top:6px}.actions button{border:0;background:transparent;color:#777e9e;font-size:11px;cursor:pointer}
.typing span{display:inline-block;width:7px;height:7px;margin:3px;border-radius:50%;background:#aaa;animation:typing 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes typing{50%{transform:translateY(-5px);opacity:.35}}
.composerArea{position:fixed;left:250px;right:0;bottom:0;padding:15px 20px 20px;background:linear-gradient(transparent,var(--bg) 40%)}.composer{max-width:900px;margin:auto;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#0b0f20e8;backdrop-filter:blur(20px)}.inputRow{display:flex;gap:8px}
#messageInput{flex:1;min-height:45px;max-height:170px;resize:none;padding:10px;border:0;outline:0;background:transparent;color:white;line-height:1.5}#messageInput::placeholder{color:#737996}.send{width:45px;height:45px;border:0;border-radius:13px;color:white;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--cyan))}.send:disabled{opacity:.45}.hint{padding:5px 8px;color:#737996;font-size:10px}
@media(max-width:760px){.sidebar{display:none}.composerArea{left:0;padding:10px}.panda{right:7px;font-size:48px}.topbar{padding-right:75px}.welcome h1{font-size:28px}.cards{grid-template-columns:1fr}.chat{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="background"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div><div class="stars"></div></div>
<div class="panda">🐼<span class="pandaText">Hi Zubee!</span></div>

<div class="app">
<aside class="sidebar">
  <div class="logo"><div class="logoIcon">✦</div><div><div class="logoTitle">Zubee AI</div><div class="logoSub">Gemini Powered</div></div></div>
  <button class="newChat" onclick="newChat()">＋ New Chat</button>
  <div class="nav">
    <button onclick="newChat()">💬 New Conversation</button>
    <button onclick="clearChat()">🗑 Clear Conversation</button>
  </div>
  <div class="status" id="sideStatus">● Ready</div>
</aside>

<main class="main">
<header class="topbar"><div><span class="topTitle">Zubee AI</span><span class="connection" id="connection">● Ready</span></div></header>

<section class="chat" id="chat">
<div class="chatInner" id="chatInner">
<div class="welcome" id="welcome">
  <div class="orb">✦</div>
  <h1>Hello! I'm Zubee 🐝</h1>
  <p>Your Gemini-powered AI assistant.</p>
  <div class="cards">
    <button class="card" onclick="suggest('Explain photosynthesis in very easy language')">🧠 Explain something</button>
    <button class="card" onclick="suggest('Make me a powerful study plan')">📚 Study Plan</button>
    <button class="card" onclick="suggest('Write a complete HTML website for me')">💻 Write Code</button>
    <button class="card" onclick="suggest('Give me 10 creative project ideas')">💡 Brainstorm</button>
  </div>
</div>
</div>
</section>

<div class="composerArea">
<div class="composer">
<div class="inputRow">
<textarea id="messageInput" rows="1" placeholder="Message Zubee AI..." oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
<button class="send" id="sendButton" onclick="sendMessage()">➤</button>
</div>
<div class="hint">Enter = send • Shift + Enter = new line</div>
</div>
</div>
</main>
</div>

<script>
/*
  IMPORTANT:
  NO GEMINI API KEY IS STORED IN THIS HTML.

  This frontend calls:
      /api/chat

  Put your Gemini API key ONLY in Vercel:
      GEMINI_API_KEY = AQ.your_key

  The Vercel /api/chat serverless function must make
  the Gemini 3.6 Flash request.
*/

let conversation=[];

const input=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const chatInner=document.getElementById("chatInner");
const chat=document.getElementById("chat");
const sideStatus=document.getElementById("sideStatus");
const connection=document.getElementById("connection");

function setStatus(text){
  sideStatus.textContent=text;
  connection.textContent=text;
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text)return;

  document.getElementById("welcome")?.remove();

  addMessage("user",text);

  conversation.push({
    role:"user",
    parts:[{text:text}]
  });

  input.value="";
  resizeInput(input);
  sendButton.disabled=true;
  setStatus("● Zubee is thinking...");

  const loading=addLoading();

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:conversation})
    });

    const data=await response.json().catch(()=>({}));
    loading.remove();

    if(!response.ok){
      throw new Error(data.error||"Zubee server error.");
    }

    const answer=data.text||data.response||"";

    if(!answer){
      throw new Error("Zubee received an empty response.");
    }

    addMessage("ai",answer);

    conversation.push({
      role:"model",
      parts:[{text:answer}]
    });

    setStatus("● Ready");

  }catch(error){
    loading.remove();
    addMessage("ai","⚠️ "+explainError(error));
    setStatus("● Error");
  }finally{
    sendButton.disabled=false;
    input.focus();
  }
}

function explainError(error){
  const message=error?.message||String(error);

  if(message.includes("Failed to fetch")){
    return "Cannot reach /api/chat. Make sure api/chat.js exists in your Vercel project and redeploy it.";
  }

  if(message.includes("401")||message.toLowerCase().includes("authentication")){
    return "Gemini rejected the API credential. Check GEMINI_API_KEY in Vercel Environment Variables and redeploy.";
  }

  if(message.includes("403")){
    return "Gemini returned 403 Forbidden. Check Gemini API access and project permissions.";
  }

  if(message.includes("429")){
    return "Gemini API quota or rate limit reached.";
  }

  return message;
}

function addMessage(role,text){
  const wrapper=document.createElement("div");
  wrapper.className="message "+role;

  const avatar=role==="ai"?"✦":"You";

  wrapper.innerHTML=`
    <div class="avatar">${avatar}</div>
    <div>
      <div class="messageName">${role==="ai"?"Zubee AI":"You"}</div>
      <div class="messageContent">${formatText(text)}</div>
      ${role==="ai"?`
      <div class="actions">
        <button onclick="copyMessage(this)">Copy</button>
        <button onclick="regenerate()">Regenerate</button>
      </div>`:""}
    </div>
  `;

  chatInner.appendChild(wrapper);
  scrollBottom();
}

function addLoading(){
  const wrapper=document.createElement("div");
  wrapper.className="message ai";

  wrapper.innerHTML=`
    <div class="avatar">✦</div>
    <div>
      <div class="messageName">Zubee AI</div>
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;

  chatInner.appendChild(wrapper);
  scrollBottom();
  return wrapper;
}

function formatText(text){
  let result=escapeHTML(text||"");

  result=result.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
  result=result.replace(/`([^`]+)`/g,"<code>$1</code>");
  result=result.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  result=result.replace(/\n/g,"<br>");

  return result;
}

function escapeHTML(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function copyMessage(button){
  const content=button.closest(".message").querySelector(".messageContent").innerText;
  navigator.clipboard.writeText(content);

  const old=button.textContent;
  button.textContent="Copied!";

  setTimeout(()=>{
    button.textContent=old;
  },1000);
}

async function regenerate(){
  if(!conversation.length)return;

  if(conversation.at(-1).role==="model"){
    conversation.pop();
  }

  const messages=chatInner.querySelectorAll(".message.ai");

  if(messages.length){
    messages[messages.length-1].remove();
  }

  sendButton.disabled=true;
  setStatus("● Regenerating...");

  const loading=addLoading();

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:conversation})
    });

    const data=await response.json();

    loading.remove();

    if(!response.ok){
      throw new Error(data.error||"Regeneration failed.");
    }

    const answer=data.text||"";

    addMessage("ai",answer);

    conversation.push({
      role:"model",
      parts:[{text:answer}]
    });

    setStatus("● Ready");

  }catch(error){
    loading.remove();
    addMessage("ai","⚠️ "+explainError(error));
    setStatus("● Error");
  }finally{
    sendButton.disabled=false;
  }
}

function newChat(){
  conversation=[];

  chatInner.innerHTML=`
    <div class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h1>Hello! I'm Zubee 🐝</h1>
      <p>Your Gemini-powered AI assistant.</p>
      <div class="cards">
        <button class="card" onclick="suggest('Explain photosynthesis in very easy language')">🧠 Explain something</button>
        <button class="card" onclick="suggest('Make me a powerful study plan')">📚 Study Plan</button>
        <button class="card" onclick="suggest('Write a complete HTML website for me')">💻 Write Code</button>
        <button class="card" onclick="suggest('Give me 10 creative project ideas')">💡 Brainstorm</button>
      </div>
    </div>
  `;

  setStatus("● Ready");
  input.focus();
}

function clearChat(){
  newChat();
}

function suggest(text){
  input.value=text;
  resizeInput(input);
  input.focus();
}

function handleKey(event){
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function resizeInput(element){
  element.style.height="auto";
  element.style.height=Math.min(element.scrollHeight,170)+"px";
}

function scrollBottom(){
  setTimeout(()=>{
    chat.scrollTop=chat.scrollHeight;
  },30);
}
</script>

</body>
</html>
