<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<meta name="description" content="Zubee AI — your intelligent AI assistant">
<title>Zubee AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070710;
  --panel: rgba(18, 18, 32, 0.78);
  --panel2: rgba(28, 28, 48, 0.72);
  --text: #f7f7ff;
  --muted: #9d9db3;
  --accent: #735cff;
  --accent2: #9b7cff;
  --border: rgba(255,255,255,.09);
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(115,92,255,.18), transparent 28%),
    radial-gradient(circle at 80% 80%, rgba(155,124,255,.12), transparent 28%),
    var(--bg);
  color: var(--text);
}

/* ================= BACKGROUND ================= */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(55px);
  opacity: .35;
  animation: floatOrb 12s ease-in-out infinite alternate;
}

.orb.one {
  width: 260px;
  height: 260px;
  background: #6c54ff;
  top: -80px;
  left: -70px;
}

.orb.two {
  width: 220px;
  height: 220px;
  background: #b06cff;
  right: -70px;
  bottom: 5%;
  animation-delay: -4s;
}

.orb.three {
  width: 170px;
  height: 170px;
  background: #405cff;
  left: 45%;
  top: 45%;
  animation-delay: -7s;
}

@keyframes floatOrb {
  from {
    transform: translate(0, 0) scale(1);
  }
  to {
    transform: translate(50px, -30px) scale(1.15);
  }
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,.65);
  animation: particleFloat linear infinite;
}

@keyframes particleFloat {
  from {
    transform: translateY(110vh);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* ================= PANDA ================= */

.panda {
  position: absolute;
  right: 6%;
  top: 14%;
  width: 105px;
  height: 105px;
  animation: pandaFloat 4s ease-in-out infinite;
  opacity: .92;
}

@keyframes pandaFloat {
  0%,100% {
    transform: translateY(0) rotate(-2deg);
  }

  50% {
    transform: translateY(-18px) rotate(2deg);
  }
}

.panda-body {
  position: absolute;
  width: 72px;
  height: 65px;
  background: #f5f5f5;
  border-radius: 50%;
  left: 17px;
  top: 30px;
  box-shadow: 0 15px 35px rgba(0,0,0,.25);
}

.panda-head {
  position: absolute;
  width: 72px;
  height: 65px;
  background: #fff;
  border-radius: 50%;
  left: 17px;
  top: 5px;
}

.ear {
  position: absolute;
  width: 27px;
  height: 27px;
  background: #111;
  border-radius: 50%;
  top: 0;
}

.ear.left {
  left: 12px;
}

.ear.right {
  right: 12px;
}

.eye {
  position: absolute;
  width: 18px;
  height: 25px;
  background: #111;
  border-radius: 50%;
  top: 27px;
}

.eye.left {
  left: 15px;
  transform: rotate(25deg);
}

.eye.right {
  right: 15px;
  transform: rotate(-25deg);
}

.eye::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  top: 6px;
  left: 5px;
}

.nose {
  position: absolute;
  width: 10px;
  height: 8px;
  background: #111;
  border-radius: 50%;
  left: 31px;
  top: 46px;
}

.arm {
  position: absolute;
  width: 20px;
  height: 38px;
  background: #111;
  border-radius: 20px;
  top: 38px;
}

.arm.left {
  left: 2px;
  transform: rotate(35deg);
}

.arm.right {
  right: 2px;
  transform: rotate(-35deg);
}

/* ================= APP ================= */

.app {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */

.header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,18,.62);
  backdrop-filter: blur(20px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: linear-gradient(135deg, #735cff, #a477ff);
  box-shadow: 0 8px 30px rgba(115,92,255,.35);
}

.brand-text {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.4px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: #a9a9ba;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #50e38a;
  box-shadow: 0 0 12px #50e38a;
}

/* ================= CHAT ================= */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 28px max(18px, calc((100% - 900px)/2));
  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 6px;
}

.chat::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12);
  border-radius: 20px;
}

.message {
  display: flex;
  margin-bottom: 22px;
  animation: messageIn .35s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: min(760px, 88%);
  padding: 14px 17px;
  border-radius: 20px;
  line-height: 1.65;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.ai .bubble {
  background: rgba(27,27,43,.82);
  border: 1px solid var(--border);
  border-bottom-left-radius: 7px;
  box-shadow: 0 10px 35px rgba(0,0,0,.15);
}

.message.user .bubble {
  background: linear-gradient(135deg, #644cff, #8067ff);
  border-bottom-right-radius: 7px;
  box-shadow: 0 10px 30px rgba(90,70,255,.25);
}

/* ================= WELCOME ================= */

.welcome {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

.welcome-inner {
  max-width: 650px;
}

.big-logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;
  border-radius: 27px;
  display: grid;
  place-items: center;
  font-size: 43px;
  background: linear-gradient(135deg, #735cff, #a477ff);
  box-shadow:
    0 0 50px rgba(115,92,255,.35),
    0 15px 50px rgba(0,0,0,.3);
  animation: logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.05);
  }
}

.welcome h1 {
  font-size: clamp(35px, 7vw, 58px);
  letter-spacing: -2px;
  margin-bottom: 10px;
}

.gradient-text {
  background: linear-gradient(90deg, #9a85ff, #d2bfff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.6;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  justify-content: center;
  margin-top: 25px;
}

.suggestion {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.045);
  color: #d8d8e7;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
  transition: .2s;
}

.suggestion:hover {
  background: rgba(115,92,255,.15);
  border-color: rgba(115,92,255,.5);
  transform: translateY(-2px);
}

/* ================= INPUT ================= */

.bottom {
  padding: 12px max(15px, calc((100% - 900px)/2)) 18px;
  background: linear-gradient(
    to top,
    rgba(7,7,16,1),
    rgba(7,7,16,.72),
    transparent
  );
}

.input-box {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 22px;
  background: rgba(21,21,35,.88);
  backdrop-filter: blur(25px);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.input-box:focus-within {
  border-color: rgba(115,92,255,.65);
  box-shadow:
    0 0 0 3px rgba(115,92,255,.08),
    0 20px 60px rgba(0,0,0,.3);
}

#input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 13px 12px;
  font-size: 16px;
}

#input::placeholder {
  color: #77778b;
}

.send {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, #735cff, #987cff);
  color: white;
  font-size: 20px;
  cursor: pointer;
  transition: .2s;
  box-shadow: 0 8px 25px rgba(115,92,255,.3);
}

.send:hover {
  transform: translateY(-2px) scale(1.03);
}

.send:active {
  transform: scale(.94);
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ================= TOOLS ================= */

.tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 7px;
  padding: 0 5px;
}

.tools span {
  font-size: 11px;
  color: #66667a;
}

.clear {
  background: transparent;
  border: 0;
  color: #77778d;
  font-size: 11px;
  cursor: pointer;
}

.clear:hover {
  color: white;
}

/* ================= TYPING ================= */

.typing {
  display: flex;
  align-items: center;
  gap: 5px;
}
