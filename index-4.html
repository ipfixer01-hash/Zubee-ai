<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18"><title>Zubee AI • Extreme</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
:root{--bg:#080a16;--panel:#101426dd;--panel2:#151a30;--text:#f8f9ff;--muted:#9aa3c2;--line:#ffffff18;--a:#8b5cf6;--b:#22d3ee;--shadow:0 25px 80px #0008}
body.light{--bg:#edf2ff;--panel:#ffffffdc;--panel2:#f7f9ff;--text:#172033;--muted:#66708b;--line:#17203318;--a:#7047e8;--b:#0891b2;--shadow:0 25px 70px #53678925}
body{overflow:hidden;background:var(--bg);color:var(--text);transition:.35s}
button,input,textarea,select{font:inherit}button{color:inherit}
#bg{position:fixed;inset:0;z-index:-5;overflow:hidden;background:radial-gradient(circle at 15% 20%,#8b5cf638,transparent 28%),radial-gradient(circle at 85% 75%,#22d3ee2c,transparent 30%),var(--bg)}
.orb{position:absolute;width:38vw;height:38vw;border-radius:50%;filter:blur(80px);opacity:.2;animation:drift 16s ease-in-out infinite alternate}.o1{background:#8b5cf6;left:-15vw;top:-15vw}.o2{background:#06b6d4;right:-15vw;top:25vh;animation-delay:-5s}.o3{background:#ec4899;left:35vw;bottom:-25vw;animation-delay:-9s}
.grid{position:absolute;inset:-15%;opacity:.07;background-image:linear-gradient(var(--text) 1px,transparent 1px),linear-gradient(90deg,var(--text) 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(60deg) translateY(30%);animation:grid 14s linear infinite}
@keyframes drift{to{transform:translate(9vw,7vh) scale(1.2) rotate(20deg)}}@keyframes grid{to{background-position:0 55px,55px 0}}
.p{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--text);opacity:.35;animation:rise linear infinite}@keyframes rise{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
.app{height:100vh;display:flex}.side{width:275px;flex:none;padding:16px;background:var(--panel);border-right:1px solid var(--line);backdrop-filter:blur(25px);z-index:20;display:flex;flex-direction:column;transition:.3s}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:17px}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 38px #8b5cf655;animation:pulse 3s infinite}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px}
@keyframes pulse{50%{transform:scale(1.06) rotate(3deg);box-shadow:0 0 65px #8b5cf677}}
.new,.send{border:0;background:linear-gradient(135deg,var(--a),var(--b));border-radius:13px;padding:12px;font-weight:800;cursor:pointer}.search{width:100%;margin:11px 0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);outline:0}.ttl{font-size:10px;color:var(--muted);margin:6px 3px}.hist{overflow:auto;flex:1}.item{display:flex;gap:7px;align-items:center;padding:10px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:12px}.item:hover{background:#ffffff0d;color:var(--text)}.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item button{border:0;background:none;cursor:pointer;color:var(--muted)}.sidebtn{width:100%;margin-top:7px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;cursor:pointer}.status{font-size:10px;color:#4ade80;padding:9px 2px}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(22px);z-index:10}.left{display:flex;align-items:center;gap:9px}.menu{display:none;border:0;background:none;font-size:22px}.mode,.theme{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer}
.panda{position:fixed;right:14px;top:5px;font-size:58px;z-index:50;filter:drop-shadow(0 13px 17px #0007);animation:jump 1.8s ease-in-out infinite}.pb{position:absolute;right:0;top:58px;white-space:nowrap;font-size:10px;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:20px}@keyframes jump{0%,100%{transform:translateY(0) rotate(-5deg)}45%{transform:translateY(-28px) rotate(7deg)}60%{transform:translateY(-15px) rotate(2deg)}}
.chat{flex:1;overflow:auto;padding:24px 15px 170px}.inner{max-width:930px;margin:auto}.welcome{text-align:center;padding:7vh 0 25px}.hero{width:92px;height:92px;margin:auto;border-radius:28px;display:grid;place-items:center;font-size:45px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 85px #8b5cf666;animation:hero 2.8s infinite}@keyframes hero{50%{transform:translateY(-7px) rotate(2deg);box-shadow:0 0 110px #8b5cf677}}.welcome h1{font-size:38px;margin:17px 0 7px}.welcome p{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:800px;margin:26px auto}.quick button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;text-align:left;cursor:pointer;backdrop-filter:blur(15px);transition:.2s}.quick button:hover{transform:translateY(-3px);border-color:#8b5cf655}.quick b{display:block;font-size:13px}.quick span{font-size:10px;color:var(--muted)}
.msg{display:flex;gap:10px;max-width:920px;margin:0 auto 22px;animation:in .3s}.msg.user{justify-content:flex-end}.av{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}.msg.ai .av{background:linear-gradient(135deg,var(--a),var(--b));border:0}.bubble{max-width:min(760px,84vw);padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:15px;line-height:1.7;backdrop-filter:blur(12px);word-wrap:break-word}.msg.user .bubble{background:linear-gradient(135deg,#7047e8,#2563eb);color:#fff;border:0}.meta{font-size:10px;color:var(--muted);margin:0 0 4px 2px}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:6px;margin-top:6px}.actions button,.tool{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 8px;font-size:10px;cursor:pointer}.actions button:hover,.tool:hover{border-color:#8b5cf655}pre{background:#050711;color:#e9ecff;border:1px solid #ffffff14;padding:13px;border-radius:11px;overflow:auto}body.light pre{background:#181d2d}.codebar{display:flex;justify-content:space-between;color:#aeb5d2;font-size:10px}.codebar button{border:1px solid #ffffff18;background:#ffffff0b;color:inherit;border-radius:6px;padding:4px 7px;cursor:pointer}.typing{display:flex;gap:4px;padding:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--b);animation:dot 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-6px);opacity:.4}}
.composerWrap{position:fixed;left:275px;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 48%);z-index:12}.composer{max-width:930px;margin:auto;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(23px);box-shadow:var(--shadow)}.tools{display:flex;gap:6px;overflow:auto;margin-bottom:6px}.tool{white-space:nowrap}.row{display:flex;align-items:flex-end;gap:8px}textarea{flex:1;min-height:45px;max-height:170px;resize:none;background:none;border:0;outline:0;color:var(--text);padding:11px;line-height:1.5}textarea::placeholder{color:var(--muted)}.send{width:46px;height:46px;color:#fff;font-size:18px}.send:disabled{opacity:.45}.hint{font-size:9px;color:var(--muted);padding:4px}
.preview{display:none;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px;font-size:10px;color:var(--muted)}.preview img{width:44px;height:44px;object-fit:cover;border-radius:8px}.preview button{border:0;background:none;cursor:pointer}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:#0008;backdrop-filter:blur(5px);z-index:100}.modal{width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.close{float:right;border:0;background:none;font-size:21px;cursor:pointer}.themeOpt{flex:1;min-width:100px;padding:13px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;cursor:pointer}.command{width:100%;padding:10px;margin-bottom:7px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;text-align:left;cursor:pointer}
@media(max-width:820px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:var(--shadow)}.side.open{transform:none}.menu{display:block}.composerWrap{left:0}.quick{grid-template-columns:1fr 1fr}.welcome h1{font-size:30px}.panda{font-size:47px}.top{padding-right:72px}}
@media(max-width:520px){.quick{grid-template-columns:1fr}.mode{max-width:105px}.welcome{padding-top:4vh}}
</style>
</head>
<body>
<div id="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="grid"></i></div>
<div class="panda" id="panda">🐼<div class="pb" id="pb">Hi! 👋</div></div>

<div class="app">
<aside class="side" id="side">
 <div class="brand"><div class="logo">✦</div><div><b>Zubee AI</b><small>Extreme Edition • 2.5 Flash-Lite</small></div></div>
 <button class="new" onclick="newChat()">＋ New Chat</button>
 <input class="search" id="search" placeholder="🔎 Search chats" oninput="renderHistory()">
 <div class="ttl">RECENT CHATS</div><div class="hist" id="hist"></div>
 <button class="sidebtn" onclick="settings()">⚙️ Settings</button>
 <button class="sidebtn" onclick="exportChat()">📤 Export conversation</button>
 <div class="status" id="status">● Ready</div>
</aside>

<main class="main">
<header class="top"><div class="left"><button class="menu" onclick="toggleSide()">☰</button><b>✦ Zubee AI</b><span id="conn" style="font-size:10px;color:#4ade80">● Ready</span></div>
<div style="display:flex;gap:7px"><select class="mode" id="mode"><option>⚡ Fast</option><option>🧠 Smart</option><option>💻 Code</option><option>📚 Study</option><option>🎨 Creative</option></select><button class="theme" id="themeBtn" onclick="cycleTheme()">🌙</button></div></header>

<section class="chat" id="chat"><div class="inner" id="inner">
<div class="welcome" id="welcome"><div class="hero">✦</div><h1>Meet Zubee AI 🐝</h1><p>Fast • smart • animated • powered by Gemini 2.5 Flash-Lite</p>
<div class="quick">
<button onclick="quick('Explain this topic in very easy language')"><b>🧠 Explain</b><span>Learn anything</span></button>
<button onclick="quick('Make me a complete study plan for my exam')"><b>📚 Study</b><span>Plan + revise + quiz</span></button>
<button onclick="quick('Write clean code for this idea: ')"><b>💻 Code</b><span>Build & debug</span></button>
<button onclick="quick('Give me 10 creative ideas for: ')"><b>💡 Brainstorm</b><span>Create instantly</span></button>
</div></div></div></section>

<div class="composerWrap"><div class="composer">
<div class="tools"><button class="tool" onclick="quick('Improve this text: ')">✨ Improve</button><button class="tool" onclick="quick('Summarize this: ')">📝 Summarize</button><button class="tool" onclick="quick('Translate this into English: ')">🌐 Translate</button><button class="tool" onclick="quick('Make MCQs from this: ')">❓ Quiz</button><button class="tool" onclick="document.getElementById('file').click()">📎 Attach</button><button class="tool" onclick="voice()">🎙️ Voice</button><input hidden id="file" type="file" accept="image/*,.txt,.md,.csv" onchange="filePick(event)"></div>
<div class="row"><textarea id="input" placeholder="Message Zubee..." oninput="resize(this)" onkeydown="keys(event)"></textarea><button class="send" id="send" onclick="send()">➤</button></div>
<div class="preview" id="preview"></div><div class="hint">Enter to send • Shift+Enter new line • Ctrl+K commands</div>
</div></div>
</main></div>

<div class="overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()"><div class="modal"><button class="close" onclick="closeSettings()">×</button><h2>⚙️ Settings</h2><p style="color:var(--muted);font-size:12px">Appearance</p><div style="display:flex;gap:8px"><button class="themeOpt" onclick="theme('dark')">🌙<br>Dark</button><button class="themeOpt" onclick="theme('light')">☀️<br>Light</button><button class="themeOpt" onclick="theme('system')">💻<br>System</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="sidebtn" onclick="clearChats()">🗑 Delete all local chats</button></div></div>
<div class="overlay" id="cmdModal" onclick="if(event.target===this)closeCmd()"><div class="modal"><button class="close" onclick="closeCmd()">×</button><h2>⌘ Command Palette</h2><input class="search" id="cmdSearch" placeholder="Search..." oninput="commands()"><div id="cmds"></div></div></div>

<script>
const API="/api/chat";let conversation=[],chats=JSON.parse(localStorage.getItem("zubee_chats")||"[]"),currentId=null,busy=false;
const $=x=>document.getElementById(x);
for(let i=0;i<55;i++){let p=document.createElement("i");p.className="p";p.style.left=Math.random()*100+"%";p.style.animationDelay=(-Math.random()*10)+"s";p.style.animationDuration=(6+Math.random()*10)+"s";$("bg").appendChild(p)}
function currentTheme(){return localStorage.getItem("zubee_theme")||"system"}function applyTheme(){let t=currentTheme(),light=t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme:light)").matches);document.body.classList.toggle("light",light);$("themeBtn").textContent=light?"☀️":"🌙"}function theme(t){localStorage.setItem("zubee_theme",t);applyTheme();closeSettings()}function cycleTheme(){let t=currentTheme();theme(t==="dark"?"light":t==="light"?"system":"dark")}applyTheme();
function save(){localStorage.setItem("zubee_chats",JSON.stringify(chats))}
function newChat(){conversation=[];currentId=Date.now().toString();$("inner").innerHTML='<div class="welcome"><div class="hero">✦</div><h1>New Zubee conversation 🐝</h1><p>Ask me anything.</p></div>';$("chat").scrollTop=0;panda("New chat! 🐼");toggleSide(false)}
function saveCurrent(){if(!conversation.length)return;if(!currentId)currentId=Date.now().toString();let u=conversation.find(x=>x.role==="user"),title=(u?.parts?.[0]?.text||"New conversation").slice(0,42),i=chats.findIndex(x=>x.id===currentId),c={id:currentId,title,messages:conversation,time:Date.now()};i>=0?chats[i]=c:chats.unshift(c);chats=chats.slice(0,50);save();renderHistory()}
function renderHistory(){let q=($("search").value||"").toLowerCase();$("hist").innerHTML="";chats.filter(c=>c.title.toLowerCase().includes(q)).forEach(c=>{let d=document.createElement("div");d.className="item";d.innerHTML='💬 <span>'+esc(c.title)+'</span><button>×</button>';d.onclick=e=>{if(e.target.tagName==="BUTTON")return;load(c.id)};d.querySelector("button").onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);save();renderHistory()};$("hist").appendChild(d)})}renderHistory();
function load(id){let c=chats.find(x=>x.id===id);if(!c)return;currentId=id;conversation=c.messages||[];$("inner").innerHTML="";conversation.forEach(m=>add(m.role==="model"?"ai":"user",(m.parts||[]).map(p=>p.text||"").join("")));scroll();panda("Welcome back! 👋");toggleSide(false)}
function add(role,text){let d=document.createElement("div");d.className="msg "+role;d.innerHTML='<div class="av">'+(role==="ai"?"✦":"You")+'</div><div><div class="meta">'+(role==="ai"?"Zubee AI":"You")+'</div><div class="bubble">'+format(text)+'</div>'+(role==="ai"?'<div class="actions"><button onclick="copyMsg(this)">📋 Copy</button><button onclick="listen(this)">🔊 Listen</button><button onclick="regen()">🔄 Regenerate</button></div>':'')+'</div>';$("inner").appendChild(d);scroll();return d}
function typing(){let d=document.createElement("div");d.className="msg ai";d.innerHTML='<div class="av">✦</div><div><div class="meta">Zubee AI</div><div class="bubble"><div class="typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div></div>';$("inner").appendChild(d);scroll();return d}
function format(t){let s=esc(t||"");s=s.replace(/```([\\w+-]*)\\n?([\\s\\S]*?)```/g,(m,l,c)=>'<div class="codebar"><span>'+esc(l||"code")+'</span><button onclick="copyCode(this)">Copy</button></div><pre><code>'+c+'</code></pre>');s=s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\\*\\*(.*?)\\*\\*/g,"<strong>$1</strong>").replace(/\\n/g,"<br>");return s}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function copyMsg(b){navigator.clipboard?.writeText(b.closest(".msg").querySelector(".bubble").innerText);b.textContent="✓ Copied";setTimeout(()=>b.textContent="📋 Copy",900)}function copyCode(b){navigator.clipboard?.writeText(b.parentElement.nextElementSibling.innerText);b.textContent="✓";setTimeout(()=>b.textContent="Copy",900)}function listen(b){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(b.closest(".msg").querySelector(".bubble").innerText))}}
function scroll(){requestAnimationFrame(()=>$("chat").scrollTop=$("chat").scrollHeight)}function resize(x){x.style.height="auto";x.style.height=Math.min(x.scrollHeight,170)+"px"}function keys(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd()}}function quick(t){$("input").value=t;resize($("input"));$("input").focus()}
function panda(t){$("pb").textContent=t;clearTimeout(window.pt);window.pt=setTimeout(()=>$("pb").textContent="Hi! 👋",2500)}function status(t){$("status").textContent=t;$("conn").textContent=t}
async function send(){if(busy)return;let text=$("input").value.trim();if(!text)return;$("welcome")?.remove();if(!currentId)currentId=Date.now().toString();add("user",text);conversation.push({role:"user",parts:[{text}]});$("input").value="";resize($("input"));busy=true;$("send").disabled=true;status("● Thinking...");panda("Thinking... 🤔");let t=typing();try{let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:conversation,mode:$("mode").value})}),d=await r.json().catch(()=>({}));t.remove();if(!r.ok)throw Error(d.error||"Server error");let a=d.text||"No response received.";add("ai",a);conversation.push({role:"model",parts:[{text:a}]});saveCurrent();status("● Ready");panda("Yay! ✨")}catch(e){t.remove();add("ai","⚠️ "+err(e));status("● Error");panda("Oops! 😵")}finally{busy=false;$("send").disabled=false}}
async function regen(){if(busy||!conversation.length)return;if(conversation.at(-1)?.role==="model")conversation.pop();document.querySelectorAll(".msg.ai").at(-1)?.remove();busy=true;$("send").disabled=true;status("● Regenerating...");let t=typing();try{let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:conversation,mode:$("mode").value})}),d=await r.json().catch(()=>({}));t.remove();if(!r.ok)throw Error(d.error||"Server error");let a=d.text||"No response";add("ai",a);conversation.push({role:"model",parts:[{text:a}]});saveCurrent();status("● Ready")}catch(e){t.remove();add("ai","⚠️ "+err(e));status("● Error")}finally{busy=false;$("send").disabled=false}}
function err(e){let m=e.message||String(e);if(m.includes("Failed to fetch"))return"Cannot reach /api/chat. Check Vercel deployment.";if(/401|authentication/i.test(m))return"Gemini authentication failed. Check GEMINI_API_KEY in Vercel.";if(/403/.test(m))return"Gemini access denied for this project.";if(/429|quota/i.test(m))return"Gemini quota/rate limit reached. Please retry later.";return m}
function toggleSide(force){let s=$("side");force===false?s.classList.remove("open"):s.classList.toggle("open")}function settings(){$("settingsModal").style.display="grid";toggleSide(false)}function closeSettings(){$("settingsModal").style.display="none"}function exportChat(){if(!conversation.length)return alert("No conversation.");let t=conversation.map(m=>(m.role==="user"?"YOU":"ZUBEE AI")+":\n"+(m.parts||[]).map(p=>p.text||"").join("")).join("\\n\\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="zubee-chat.txt";a.click()}
function clearChats(){if(confirm("Delete all local chats?")){chats=[];save();renderHistory();newChat();closeSettings()}}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert("Voice input is not supported here.");let r=new SR();r.lang=navigator.language||"en-US";r.interimResults=true;panda("Listening... 🎙️");r.onresult=e=>{$("input").value=[...e.results].map(x=>x[0].transcript).join("");resize($("input"))};r.onend=()=>panda("Hi! 👋");r.start()}
function filePick(e){let f=e.target.files?.[0];if(!f)return;let p=$("preview");p.style.display="flex";if(f.type.startsWith("image/")){let u=URL.createObjectURL(f);p.innerHTML='<img src="'+u+'"><span>'+esc(f.name)+'</span><button onclick="removeFile()">×</button>'}else p.innerHTML='📎 <span>'+esc(f.name)+'</span><button onclick="removeFile()">×</button>'}
function removeFile(){$("preview").style.display="none";$("file").value=""}
const cmd=[["➕ New chat",newChat],["⚙️ Settings",settings],["🌙 Toggle theme",cycleTheme],["💻 Code mode",()=>{$("mode").value="💻 Code"}],["📚 Study mode",()=>{$("mode").value="📚 Study"}],["🎙️ Voice input",voice],["📤 Export chat",exportChat]];
function openCmd(){$("cmdModal").style.display="grid";commands();$("cmdSearch").focus()}function closeCmd(){$("cmdModal").style.display="none"}function commands(){let q=($("cmdSearch").value||"").toLowerCase();$("cmds").innerHTML="";cmd.filter(x=>x[0].toLowerCase().includes(q)).forEach(x=>{let b=document.createElement("button");b.className="command";b.textContent=x[0];b.onclick=()=>{closeCmd();x[1]()};$("cmds").appendChild(b)})}document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCmd();closeSettings()}})
</script>
</body>
</html>
